<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TypeWise</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="../styles/main.css">

    <link rel="stylesheet" href="../codemirror/lib/codemirror.css">
    <script src="../codemirror/lib/codemirror.js"></script>
    <link rel="stylesheet" href="../codemirror/theme/monokai.css">
    <script src="../codemirror/mode/clike/clike.js"></script>
    <script src="../codemirror/addon/selection/active-line.js"></script>
    <script src="../codemirror/addon/edit/closebrackets.js"></script>
    <script src="../codemirror/addon/edit/matchbrackets.js"></script>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar bg-dark" data-bs-theme="dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">TypeWise - 201901421</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                            aria-expanded="false">
                            Archivo
                        </a>
                        <ul class="dropdown-menu">
                            <li>
                                <a class="dropdown-item" href="#">
                                    <button class="btn btn-outline-light" type="button" id="new-file">Crear
                                        Archivo</button>
                                </a>
                            </li>
                            <li>
                                <a class="dropdown-item" href="#">
                                    <button class="btn btn-outline-light" type="button" id="open-file">Abrir
                                        Archivo</button>
                                    <input type="file" accept=".tw" id="input-file">
                                </a>
                            </li>
                            <li>
                                <a class="dropdown-item" href="#">
                                    <button class="btn btn-outline-light" type="button" id="save-file">Guardar
                                        Archivo</button>
                                </a>
                            </li>
                        </ul>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                            aria-expanded="false">
                            Reportes
                        </a>
                        <ul class="dropdown-menu">
                            <li>
                                <a class="dropdown-item" href="#">
                                    <button class="btn btn-outline-light" type="button" id="reporte-errores">Reporte
                                        Errores</button>
                                </a>
                            </li>
                            <li><a class="dropdown-item" href="#">Tabla de Símbolos</a></li>
                            <li><a class="dropdown-item" href="#">Reporte de Errores</a></li>
                        </ul>
                    </li>
                </ul>
                <button class="btn btn-outline-light" type="button" id="ejecutar">Ejecutar</button>
            </div>
        </div>
    </nav>
    <div class="main-container">
        <div class="editor-container">
            <h3>EDITOR</h3>
            <textarea name="" id="editor"></textarea>
        </div>
        <div class="consola-container">
            <h3>CONSOLA</h3>
            <textarea name="" id="consola"></textarea>
        </div>
    </div>
    <script src="../scripts/main.js"></script>
</body>

</html>
